[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rectlu-genomic-screening"
version = "4.0.0"
description = "Scale-Adaptive Piecewise-Quadratic Rectifiers for Imbalanced Genomic Variant Screening"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Preecha Noiumkar", email = "preecha.n@msu.ac.th"},
  {name = "Thawatchai Chomsiri", email = "thawatchai.c@msu.ac.th"}
]
dependencies = ["torch>=2.1.0", "numpy>=1.26.0", "scipy>=1.11.0", "scikit-learn>=1.3.0", "pandas>=2.1.0"]
